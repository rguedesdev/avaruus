name: avaruus-development

services:
  mongodb:
    image: mongo:7.0.28
    container_name: avaruus-mongodb-development
    restart: unless-stopped
    ports:
      - "127.0.0.1:37017:27017"
    volumes:
      - avaruus-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  avaruus-mongodb-data:
